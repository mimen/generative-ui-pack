name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Test
        run: bun test tests
      - name: Verify committed release artifacts
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install verifier dependencies
        run: bun install --frozen-lockfile
      - name: Verify tagged release and clean Git consumer
        env:
          RELEASE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run verify:release --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
